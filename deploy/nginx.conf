# Configurazione di nginx del container. È l'unico processo raggiungibile
# dall'esterno (porta 7860): serve il front end già compilato e inoltra al back
# end solo /api/ e /charts/. Data agent e Chroma ascoltano su 127.0.0.1 e non
# passano da qui.
#
# Gira come utente non root: niente direttiva "user", file pid e cartelle
# temporanee in /tmp, log su stdout/stderr (li raccoglie la piattaforma).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # Le cartelle temporanee predefinite (in /var/lib/nginx) non sono scrivibili
    # da un utente non root.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Il back end accetta corpi fino a 10 kb e risponde da solo con il proprio
    # errore JSON; il limite di nginx sta sopra, per non intercettarli prima.
    client_max_body_size 1m;

    server {
        listen 7860;
        server_name _;
        root /app/www;
        index index.html;

        add_header X-Content-Type-Options nosniff always;

        # Impostazioni comuni delle due rotte inoltrate al back end.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Aggiunge l'IP di chi si è collegato a nginx in coda a X-Forwarded-For:
        # il back end (TRUST_PROXY) legge l'IP del client da qui per il limite
        # di frequenza.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Il back end interrompe l'elaborazione a 120 s (504): nginx non deve
        # chiudere prima, altrimenti l'utente vedrebbe un errore diverso.
        proxy_read_timeout 140s;
        proxy_send_timeout 140s;
        send_timeout 140s;

        # Solo queste due rotte arrivano al back end. Tutto il resto (compreso
        # il controllo di stato GET / del back end) non è raggiungibile.
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
        }

        location /charts/ {
            proxy_pass http://127.0.0.1:3001;
        }

        # Front end statico. Un percorso inesistente dà 404 e non rimanda alla
        # pagina iniziale.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}